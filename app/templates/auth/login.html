{% extends "base.html" %}

{% block title %}Login - MemóriaViva{% endblock %}

{% block extra_css %}{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-8 col-lg-5">
        <div class="auth-card" data-aos="fade-up">
          <div class="auth-title">
            <i class="bi bi-shield-lock-fill"></i>
            <span>Entrar</span>
          </div>
          <form method="post" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control auth-input" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control auth-input" id="senha" name="senha" required>
            </div>
            <button type="submit" class="btn auth-btn mt-3">
              <i class="bi bi-box-arrow-in-right"></i>
              Entrar
            </button>
          </form>
          <div class="text-center mt-4">
            <small class="auth-helper">
              Não tem uma conta?
              <a href="{{ url_for('auth.register') }}">Cadastre-se</a>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
